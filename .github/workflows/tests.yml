name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Check the proposed public Git history
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/public_content_check.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - run: uv sync --locked --group dev
      - run: uv run ruff check custom_components tests tools
      - run: uv run ruff format --check custom_components tests tools
      - run: uv run pytest -q
