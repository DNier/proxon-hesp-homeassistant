name: Publish release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --locked --group dev
      - run: uv run ruff check custom_components tests tools/release_notes.py
      - run: uv run pytest -q
      - name: Publish matching version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("custom_components/proxon_hesp/manifest.json"))["version"])')
          python -m tools.release_notes --version "$VERSION" --output "$RUNNER_TEMP/release-notes.md"
          if [[ "$VERSION" =~ (a|b|rc|dev)[0-9]+ ]]; then
            RELEASE_FLAGS=(--prerelease --latest=false)
          else
            RELEASE_FLAGS=(--latest)
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "PROXON HESP $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" "${RELEASE_FLAGS[@]}"
